name: Refresh FIFA Data

on:
  schedule:
    # Every 10 minutes — free on public repos, costs nothing
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh data + sync predictions + score
        run: npm run refresh
        env:
          DATA_DIR: ./data
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}

      - name: Commit updated app-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app-data.json
          git diff --staged --quiet || (git commit -m "data: auto-refresh $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci] [skip vercel]" && git push)
