name: Refresh FIFA Data

on:
  # SCHEDULE PAUSED during the Apps Script backend cutover (2026-07-06). The cron builds
  # app-data from the GitHub secrets; until those secrets hold the NEW backend URLs, a run
  # would repoint the live app at the OLD replace-backend and the open-only save could wipe
  # locked picks. Re-enable (uncomment) ONLY after APPS_SCRIPT_URL / _G1 / _G2 secrets are
  # updated to the new URLs.
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:  # Manual trigger only while schedule is paused

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN defaults to read-only; the commit step needs write to push data refreshes
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh data + sync predictions + score
        run: npm run refresh
        env:
          DATA_DIR: ./data
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}

      - name: Refresh groups (reuses shared fixtures from LR run)
        run: npm run refresh:groups
        env:
          APPS_SCRIPT_URL_G1: ${{ secrets.APPS_SCRIPT_URL_G1 }}
          APPS_SCRIPT_URL_G2: ${{ secrets.APPS_SCRIPT_URL_G2 }}

      - name: Commit updated app-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public data/predictions.json data/groups
          git diff --staged --quiet || (git commit -m "data: auto-refresh $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci] [skip vercel]" && git push)
